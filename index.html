<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Office Green Fix - Versão Completa</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; }
        
        /* Camadas: CSS atrás para permitir que o WebGL/HUD receba cliques primeiro */
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; }
        #css-canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* HUD e Controles */
        #hud { position: absolute; bottom: 20px; width: 100%; z-index: 100; pointer-events: none; display: flex; justify-content: center; }
        .controls { pointer-events: all; display: flex; gap: 10px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 15px; }
        button { padding: 15px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 8px; border: none; background: #eee; transition: 0.2s; }
        button:hover { background: #fff; transform: scale(1.05); }
        
        /* Menu de Edição */
        #menu-edit { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; z-index: 200; display: none; border-radius: 10px; width: 300px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        input, textarea { width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; }

        /* Joystick */
        #joy-base { position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; z-index: 100; pointer-events: all; touch-action: none; }
        #joy-stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: white; border-radius: 50%; }
    </style>
</head>
<body>

<div id="joy-base"><div id="joy-stick"></div></div>

<div id="hud">
    <div class="controls">
        <button onclick="addMesa()" style="background: #28a745; color: white;">+ Mesa</button>
        <button id="btn-sit" onclick="toggleSit()" style="background: #007bff; color: white;">Sentar</button>
        <button id="btn-edit" onclick="abrirMenu()" style="background: #f39c12; color: white; display:none;">Editar</button>
        <button id="btn-interact" onclick="toggleInteract()" style="background: #e74c3c; color: white; display:none;">Mexer na Tela</button>
    </div>
</div>

<div id="menu-edit">
    <h3 style="margin-top:0">Configurar Monitor</h3>
    <input type="text" id="url" placeholder="Link (ex:https://theuzindablack.github.io/Pvp2d-competitivo/ )">
    <textarea id="html" rows="4" placeholder="Ou escreva um texto/HTML aqui..."></textarea>
    <button onclick="salvar()" style="background: #28a745; color: white; width: 100%;">SALVAR</button>
    <button onclick="fechar()" style="width: 100%; margin-top: 5px;">FECHAR</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

<script>
/** VARIÁVEIS GLOBAIS **/
let scene, camera, renderer, cssRenderer, player;
let move = { x: 0, z: 0 }, keys = {}, stations = [], target = null;
let isSitting = false, isInteracting = false;
let joyActive = false;

init();

function init() {
    // 1. Cena e Câmera
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    // 2. Renderizador WebGL (Mundo 3D)
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.id = "webgl-canvas";
    document.body.appendChild(renderer.domElement);

    // 3. Renderizador CSS3D (Telas de sites)
    cssRenderer = new THREE.CSS3DRenderer();
    cssRenderer.setSize(window.innerWidth, window.innerHeight);
    cssRenderer.domElement.id = "css-canvas";
    document.body.appendChild(cssRenderer.domElement);

    // 4. Luzes
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));

    // 5. Cenário (Chão e Grade)
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshPhongMaterial({ color: 0x348C31 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(100, 50, 0x000000, 0x222222));

    // 6. Jogador (Representação visual)
    player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), new THREE.MeshPhongMaterial({ color: 0x007bff }));
    body.position.y = 0.6;
    player.add(body);
    scene.add(player);

    // 7. Mesa Inicial
    addMesa(0, -5, "https://www.bing.com");

    // Eventos de Input
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('resize', onWindowResize);
    setupJoystick();

    animate();
}

/** FUNÇÕES DE CRIAÇÃO **/
function addMesa(x = player.position.x, z = player.position.z - 4, url = "") {
    const group = new THREE.Group();
    
    // Objeto 3D: Mesa
    const desk = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.1, 1.5), new THREE.MeshPhongMaterial({color: 0x444}));
    desk.position.y = 0.8;
    group.add(desk);

    // Pernas da mesa
    const legGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
    for(let i of [-1, 1]) for(let j of [-0.5, 0.5]) {
        const leg = new THREE.Mesh(legGeo, new THREE.MeshPhongMaterial({color: 0x222}));
        leg.position.set(i * 1.1, 0.4, j * 0.6);
        group.add(leg);
    }

    // A Tela (Elemento HTML)
    const div = document.createElement('div');
    div.style.width = '800px';
    div.style.height = '500px';
    div.style.background = 'white';
    div.style.border = "10px solid #111";
    
    const cssObj = new THREE.CSS3DObject(div);
    cssObj.position.set(0, 1.5, -0.6); // Posição acima da mesa
    cssObj.scale.set(1.8/800, 1.1/500, 1);
    group.add(cssObj);

    group.position.set(x, 0, z);
    scene.add(group);

    const st = { group, div, url, html: "" };
    stations.push(st);
    renderTela(st);
}

function renderTela(st) {
    if(st.url) {
        st.div.innerHTML = `<iframe src="${st.url}" style="width:100%; height:100%; border:none;"></iframe>`;
    } else {
        st.div.innerHTML = `<div style="padding:40px; font-size:40px; text-align:center; font-family:sans-serif;">${st.html || "Vazio"}</div>`;
    }
}

/** INTERAÇÕES **/
function toggleSit() {
    if(!target && !isSitting) return;
    isSitting = !isSitting;
    
    const btnSit = document.getElementById('btn-sit');
    const btnInteract = document.getElementById('btn-interact');

    if(isSitting) {
        btnSit.innerText = "Levantar";
        btnSit.style.background = "#555";
        btnInteract.style.display = "block";
        // Trava o player na frente da mesa
        player.position.set(target.group.position.x, 0, target.group.position.z + 1);
    } else {
        btnSit.innerText = "Sentar";
        btnSit.style.background = "#007bff";
        btnInteract.style.display = "none";
        if(isInteracting) toggleInteract();
    }
}

function toggleInteract() {
    isInteracting = !isInteracting;
    const canvasCSS = document.getElementById('css-canvas');
    const btn = document.getElementById('btn-interact');

    if(isInteracting) {
        canvasCSS.style.zIndex = "10"; // Traz a tela para frente dos botões
        btn.innerText = "Parar de Mexer";
        btn.style.background = "#222";
    } else {
        canvasCSS.style.zIndex = "1"; // Volta a tela para o fundo
        btn.innerText = "Mexer na Tela";
        btn.style.background = "#e74c3c";
    }
}

/** MENU DE EDIÇÃO **/
function abrirMenu() {
    if(!target) return;
    document.getElementById('url').value = target.url;
    document.getElementById('html').value = target.html;
    document.getElementById('menu-edit').style.display = "block";
}

function fechar() { document.getElementById('menu-edit').style.display = "none"; }

function salvar() {
    if(target) {
        target.url = document.getElementById('url').value;
        target.html = document.getElementById('html').value;
        renderTela(target);
        fechar();
    }
}

/** JOYSTICK E MOVIMENTO **/
function setupJoystick() {
    const joyBase = document.getElementById('joy-base');
    const joyStick = document.getElementById('joy-stick');

    joyBase.addEventListener('touchstart', () => joyActive = true);
    window.addEventListener('touchend', () => {
        joyActive = false;
        joyStick.style.transform = `translate(0px, 0px)`;
        move.x = 0; move.z = 0;
    });

    window.addEventListener('touchmove', e => {
        if (!joyActive) return;
        const rect = joyBase.getBoundingClientRect();
        const centerX = rect.left + rect.width/2;
        const centerY = rect.top + rect.height/2;
        const touch = e.touches[0];

        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
        const angle = Math.atan2(dy, dx);

        move.x = (Math.cos(angle) * dist) / 40;
        move.z = (Math.sin(angle) * dist) / 40;
        joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
    });
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    cssRenderer.setSize(window.innerWidth, window.innerHeight);
}

/** LOOP DE ANIMAÇÃO **/
function animate() {
    requestAnimationFrame(animate);
    
    if(!isSitting) {
        // Movimentação
        let dirX = (keys['d']?1:0) - (keys['a']?1:0) + move.x;
        let dirZ = (keys['s']?1:0) - (keys['w']?1:0) + move.z;
        
        player.position.x += dirX * 0.15;
        player.position.z += dirZ * 0.15;
        
        // Câmera segue o jogador
        camera.position.lerp(new THREE.Vector3(player.position.x, 5, player.position.z + 7), 0.1);
        camera.lookAt(player.position);

        // Busca mesa próxima
        target = null;
        stations.forEach(s => {
            if(player.position.distanceTo(s.group.position) < 3) target = s;
        });
        
        document.getElementById('btn-edit').style.display = target ? "block" : "none";
    } else if(target) {
        // Câmera foca na tela da mesa atual
        const camTarget = new THREE.Vector3(target.group.position.x, 1.8, target.group.position.z + 1.2);
        camera.position.lerp(camTarget, 0.1);
        camera.lookAt(target.group.position.x, 1.5, target.group.position.z - 0.5);
    }

    renderer.render(scene, camera);
    cssRenderer.render(scene, camera);
}
</script>
</body>
</html>
